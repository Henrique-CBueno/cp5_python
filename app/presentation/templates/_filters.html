<form id="filters" class="filter-bar" aria-label="Filtros de vulnerabilidades">
  <div class="search-field"><label for="q" class="sr-only">Buscar CVE, produto, fornecedor ou título</label>{{ icon('search') }}<input id="q" name="q" type="search" placeholder="Buscar CVE, produto ou título…" maxlength="200"></div>
  <div><label for="vendor">Fornecedor</label><select id="vendor" name="vendor"><option value="">Todos os fornecedores</option></select></div>
  <div><label for="severity">Severidade CVSS</label><select id="severity" name="severity"><option value="">Todas as severidades</option><option value="CRITICAL">Crítica</option><option value="HIGH">Alta</option><option value="MEDIUM">Média</option><option value="LOW">Baixa</option><option value="NONE">Nenhuma</option><option value="UNASSESSED">Sem avaliação</option></select></div>
  <details class="extra-filters"><summary>Mais filtros</summary><div class="extra-filter-content"><label for="ransomware">Uso em ransomware</label><select id="ransomware" name="ransomware"><option value="">Todos</option><option value="Known">Conhecido</option><option value="Unknown">Não confirmado</option></select><label for="date_from">Incluída a partir de</label><input id="date_from" name="date_from" type="date"><label for="date_to">Incluída até</label><input id="date_to" name="date_to" type="date"><label for="product_key">Produto específico</label><select id="product_key" name="product_key"><option value="">Todos os produtos</option></select></div></details>
  <button type="submit" class="button primary">Aplicar</button><button type="reset" class="button subtle">Limpar</button>
</form>
