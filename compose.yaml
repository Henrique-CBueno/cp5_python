services:
  web:
    build: .
    environment: &app-environment
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      COGNITO_ENDPOINT: http://cognito:9229
      COGNITO_ISSUER: http://0.0.0.0:9229
      SMTP_HOST: mailpit
      PUBLIC_URL: http://localhost:8000
      NVD_API_KEY: ${NVD_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      mongo: {condition: service_healthy}
      cognito: {condition: service_started}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: .
    command: ["python", "-m", "app.cli", "worker"]
    environment: *app-environment
    depends_on:
      mongo: {condition: service_healthy}
      cognito: {condition: service_started}
      mailpit: {condition: service_started}
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}) }'"]
      interval: 5s
      timeout: 10s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  cognito:
    image: jagregory/cognito-local:5.3.0
    environment:
      CODE: "123456"
    ports: ["127.0.0.1:9229:9229"]
    volumes: ["cognito-data:/app/.cognito"]
volumes:
  mongo-data:
  cognito-data:
