services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}) }'"]
      interval: 5s
      timeout: 10s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  cognito:
    image: jagregory/cognito-local:5.3.0
    environment:
      CODE: "123456"
    ports: ["127.0.0.1:9229:9229"]
    volumes: ["cognito-data:/app/.cognito"]
volumes:
  mongo-data:
  cognito-data:
