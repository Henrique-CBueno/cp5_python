[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilia"
version = "0.1.0"
description = "Observatório de vulnerabilidades exploradas e alertas por produto"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "pymongo>=4.11,<5",
  "pydantic-settings>=2.8,<3", "boto3>=1.37,<2", "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker services"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
